[flake8]
max-line-length = 100
exclude = .git,__pycache__,migrations,venv,.venv
ignore = E203,W503

[isort]
profile = black
line_length = 100
skip = migrations,.venv,venv

[coverage:run]
source = apps
omit = */migrations/*,*/tests/*,*/management/commands/*,apps/sandbox/services.py

[coverage:report]
show_missing = true
skip_covered = true
