components:
  schemas:
    APIKey:
      type: object
      description: |-
        API Key serializer.

        ``key_hash`` is **never** exposed. The raw key is only returned once
        at creation time via a separate view; this serializer is for listing
        and managing existing keys.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        prefix:
          type: string
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_by_email:
          type: string
          format: email
          readOnly: true
        permissions: {}
        rate_limit:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - company
      - company_name
      - created_at
      - created_by
      - created_by_email
      - id
      - last_used_at
      - name
      - prefix
    APIKeyCreate:
      type: object
      description: |-
