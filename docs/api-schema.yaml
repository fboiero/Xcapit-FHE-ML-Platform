openapi: 3.0.3
info:
  title: Xcapit FHE-ML Platform API
  version: 2.0.0
  description: |-
    Privacy-preserving machine learning platform with 4 cryptographic layers (FHE, ZKP, MPC, Differential Privacy) and on-chain governance via Arbitrum.

    ## Authentication

    Two methods supported:
    - **JWT Bearer**: `Authorization: Bearer <token>` — obtained via `/api/v2/auth/login/`
    - **API Key**: `X-API-Key: <key>` — created via `/api/v2/auth/api-keys/create/`

    ## Rate Limiting

    Endpoints are rate-limited by tier (free/starter/professional/enterprise). See response headers `X-RateLimit-Limit` and `X-RateLimit-Remaining`.

    ## Errors

    All errors follow RFC 7807 format with `code`, `message`, `status`, and `details` fields.
  contact:
    name: Xcapit Team
    email: dev@xcapit.com
  license:
    name: AGPL-3.0-or-later
