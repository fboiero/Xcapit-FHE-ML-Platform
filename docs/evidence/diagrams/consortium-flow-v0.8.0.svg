<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
        </marker>
    </defs>

    <!-- Title -->
    <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Flujo de Consorcio - Con Automatizaciones v0.8.0</text>

    <!-- Start -->
    <circle cx="100" cy="80" r="25" fill="#6366f1"/>
    <text x="100" y="85" text-anchor="middle" font-size="11" fill="white" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">START</text>

    <!-- Step 1: Create Consortium -->
    <rect x="170" y="55" width="150" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="245" y="75" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">1. Crear Consorcio</text>
    <text x="245" y="90" text-anchor="middle" font-size="9" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif">POST /consortiums/</text>

    <!-- Arrow 1 -->
    <path d="M 125 80 L 170 80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Response ID Badge -->
    <rect x="330" y="60" width="80" height="20" rx="10" fill="#d1fae5"/>
    <text x="370" y="74" text-anchor="middle" font-size="8" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">+ ID (NEW)</text>

    <!-- Step 2: Send Invitations -->
    <rect x="420" y="55" width="150" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="495" y="75" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">2. Enviar Invitaciones</text>
    <text x="495" y="90" text-anchor="middle" font-size="9" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif">POST /invitations/</text>

    <!-- Arrow 2 -->
    <path d="M 320 80 L 420 80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Email notification -->
    <rect x="580" y="50" width="90" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="625" y="62" text-anchor="middle" font-size="8" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, sans-serif">EMAIL</text>
    <text x="625" y="73" text-anchor="middle" font-size="7" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Invitacion enviada</text>

    <!-- Step 3: Accept Invitations -->
    <rect x="680" y="55" width="150" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="755" y="75" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">3. Aceptar Invitacion</text>
    <text x="755" y="90" text-anchor="middle" font-size="9" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif">POST ../accept/</text>

    <!-- Arrow 3 -->
    <path d="M 570 80 L 580 80 M 670 65 L 680 65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Arrow down from step 3 -->
    <path d="M 755 105 L 755 150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Signal: Auto-activate -->
    <rect x="600" y="160" width="180" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="690" y="180" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SIGNAL: post_save</text>
    <text x="690" y="195" text-anchor="middle" font-size="9" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ConsortiumMember</text>
    <text x="690" y="210" text-anchor="middle" font-size="8" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">auto_activate_consortium()</text>

    <!-- Decision: min_members? -->
    <polygon points="690,240 760,280 690,320 620,280" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="690" y="275" text-anchor="middle" font-size="9" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, sans-serif">members</text>
    <text x="690" y="287" text-anchor="middle" font-size="9" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, sans-serif">>= min?</text>

    <!-- Arrow to decision -->
    <path d="M 690 220 L 690 240" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- No path - loop back -->
    <text x="800" y="275" font-size="9" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif">No</text>
    <path d="M 760 280 L 820 280 L 820 80 L 680 80" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>

    <!-- Yes path -->
    <text x="665" y="340" font-size="9" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Si</text>
    <path d="M 690 320 L 690 360" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Auto-activate box -->
    <rect x="600" y="365" width="180" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="690" y="385" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Status -> ACTIVE</text>
    <text x="690" y="398" text-anchor="middle" font-size="8" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, sans-serif">AUTOMATICO</text>

    <!-- Arrow to step 4 -->
    <path d="M 600 385 L 400 385" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Step 4: Contribute Data -->
    <rect x="220" y="360" width="180" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="380" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">4. Contribuir Datos</text>
    <text x="310" y="395" text-anchor="middle" font-size="9" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif">POST /contributions/</text>

    <!-- Signal: Auto-verify -->
    <rect x="50" y="350" width="150" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="125" y="370" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SIGNAL: post_save</text>
    <text x="125" y="385" text-anchor="middle" font-size="9" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ContributionProof</text>
    <text x="125" y="400" text-anchor="middle" font-size="8" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">auto_verify_contribution()</text>
    <text x="125" y="413" text-anchor="middle" font-size="8" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SHA-256 + count + member</text>

    <!-- Arrow to verify signal -->
    <path d="M 220 385 L 200 385" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Verified status -->
    <rect x="50" y="440" width="150" height="30" rx="4" fill="#d1fae5" stroke="#10b981"/>
    <text x="125" y="460" text-anchor="middle" font-size="9" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">status: VERIFIED</text>

    <!-- Arrow down -->
    <path d="M 125 420 L 125 440" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Blockchain registration -->
    <rect x="50" y="490" width="150" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="125" y="507" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Celery Task</text>
    <text x="125" y="520" text-anchor="middle" font-size="8" fill="#7c3aed" font-family="-apple-system, BlinkMacSystemFont, sans-serif">register_blockchain()</text>

    <!-- Arrow to blockchain -->
    <path d="M 125 470 L 125 490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Step 5: Start Training -->
    <rect x="300" y="480" width="180" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="390" y="500" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">5. Iniciar Entrenamiento</text>
    <text x="390" y="515" text-anchor="middle" font-size="9" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, sans-serif">POST /start_training/</text>

    <!-- Arrow from contributions -->
    <path d="M 310 410 L 310 450 L 350 450 L 350 480" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Celery training task -->
    <rect x="500" y="480" width="180" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="590" y="500" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Celery: train_model</text>
    <text x="590" y="515" text-anchor="middle" font-size="9" fill="#be185d" font-family="-apple-system, BlinkMacSystemFont, sans-serif">task_id + FHE SDK</text>

    <!-- Arrow to celery -->
    <path d="M 480 505 L 500 505" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Training result -->
    <rect x="700" y="480" width="150" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="775" y="500" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">TrainingResult</text>
    <text x="775" y="515" text-anchor="middle" font-size="9" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, sans-serif">accuracy + model_hash</text>

    <!-- Arrow to result -->
    <path d="M 680 505 L 700 505" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- End -->
    <circle cx="775" cy="570" r="20" fill="#10b981"/>
    <text x="775" y="575" text-anchor="middle" font-size="10" fill="white" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">END</text>

    <!-- Arrow to end -->
    <path d="M 775 530 L 775 550" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Legend -->
    <rect x="50" y="550" width="200" height="40" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="568" font-size="9" fill="#6b7280" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Leyenda:</text>
    <rect x="60" y="575" width="12" height="12" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="78" y="585" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">API Call</text>
    <rect x="120" y="575" width="12" height="12" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="2,1"/>
    <text x="138" y="585" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Signal (Auto)</text>
    <rect x="190" y="575" width="12" height="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="208" y="585" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Resultado</text>
</svg>
