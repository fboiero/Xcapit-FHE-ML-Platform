<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <defs>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6366f1"/>
            <stop offset="100%" style="stop-color:#4f46e5"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
        </marker>
    </defs>

    <!-- Title -->
    <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Arquitectura v0.8.0 - Consortium Automation</text>

    <!-- Frontend Layer -->
    <rect x="50" y="60" width="800" height="70" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="85" font-size="12" fill="#6b7280" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">FRONTEND</text>
    <rect x="70" y="95" width="120" height="25" rx="4" fill="#6366f1" filter="url(#shadow)"/>
    <text x="130" y="112" text-anchor="middle" font-size="11" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">React Dashboard</text>
    <rect x="210" y="95" width="100" height="25" rx="4" fill="#6366f1" filter="url(#shadow)"/>
    <text x="260" y="112" text-anchor="middle" font-size="11" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">API Client</text>

    <!-- API Layer -->
    <rect x="50" y="150" width="800" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="70" y="175" font-size="12" fill="#1d4ed8" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">DJANGO REST API (v2)</text>

    <rect x="70" y="190" width="140" height="45" rx="4" fill="white" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="140" y="210" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ConsortiumViewSet</text>
    <text x="140" y="225" text-anchor="middle" font-size="9" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">CRUD + start_training</text>

    <rect x="230" y="190" width="140" height="45" rx="4" fill="white" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="300" y="210" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">InvitationViewSet</text>
    <text x="300" y="225" text-anchor="middle" font-size="9" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">accept / decline</text>

    <rect x="390" y="190" width="140" height="45" rx="4" fill="white" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="460" y="210" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ContributionViewSet</text>
    <text x="460" y="225" text-anchor="middle" font-size="9" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">create + verify</text>

    <rect x="550" y="190" width="130" height="45" rx="4" fill="#fef3c7" stroke="#fcd34d" filter="url(#shadow)"/>
    <text x="615" y="210" text-anchor="middle" font-size="10" fill="#92400e" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Serializers</text>
    <text x="615" y="225" text-anchor="middle" font-size="9" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, sans-serif">+ ID returns (NEW)</text>

    <rect x="700" y="190" width="130" height="45" rx="4" fill="white" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="765" y="210" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">JWT Auth</text>
    <text x="765" y="225" text-anchor="middle" font-size="9" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Token + Blacklist</text>

    <!-- Services Layer -->
    <rect x="50" y="270" width="500" height="100" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="70" y="295" font-size="12" fill="#065f46" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SERVICES LAYER (NEW)</text>

    <rect x="70" y="310" width="100" height="45" rx="4" fill="white" stroke="#6ee7b7" filter="url(#shadow)"/>
    <text x="120" y="330" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Verification</text>
    <text x="120" y="343" text-anchor="middle" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Auto-verify</text>

    <rect x="185" y="310" width="100" height="45" rx="4" fill="white" stroke="#6ee7b7" filter="url(#shadow)"/>
    <text x="235" y="330" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Training</text>
    <text x="235" y="343" text-anchor="middle" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">FHE Models</text>

    <rect x="300" y="310" width="100" height="45" rx="4" fill="white" stroke="#6ee7b7" filter="url(#shadow)"/>
    <text x="350" y="330" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Blockchain</text>
    <text x="350" y="343" text-anchor="middle" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Arbitrum</text>

    <rect x="415" y="310" width="100" height="45" rx="4" fill="white" stroke="#6ee7b7" filter="url(#shadow)"/>
    <text x="465" y="330" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Email</text>
    <text x="465" y="343" text-anchor="middle" font-size="8" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Notifications</text>

    <!-- Signals Box -->
    <rect x="570" y="270" width="130" height="100" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="635" y="295" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SIGNALS</text>
    <text x="635" y="315" text-anchor="middle" font-size="9" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">post_save</text>
    <text x="635" y="330" text-anchor="middle" font-size="9" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Auto-activate</text>
    <text x="635" y="345" text-anchor="middle" font-size="9" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Auto-verify</text>
    <text x="635" y="360" text-anchor="middle" font-size="9" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Send emails</text>

    <!-- Celery Box -->
    <rect x="720" y="270" width="130" height="100" rx="8" fill="#fce7f3" stroke="#f9a8d4"/>
    <text x="785" y="295" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">CELERY</text>
    <text x="785" y="315" text-anchor="middle" font-size="9" fill="#831843" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Async Tasks</text>
    <text x="785" y="330" text-anchor="middle" font-size="9" fill="#831843" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• train_model</text>
    <text x="785" y="345" text-anchor="middle" font-size="9" fill="#831843" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• register_bc</text>
    <text x="785" y="360" text-anchor="middle" font-size="9" fill="#831843" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• retry logic</text>

    <!-- Data Layer -->
    <rect x="50" y="390" width="800" height="90" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="415" font-size="12" fill="#6b7280" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">DATA LAYER</text>

    <rect x="70" y="430" width="120" height="35" rx="4" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="130" y="452" text-anchor="middle" font-size="10" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">PostgreSQL</text>

    <rect x="210" y="430" width="120" height="35" rx="4" fill="#ef4444" filter="url(#shadow)"/>
    <text x="270" y="452" text-anchor="middle" font-size="10" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Redis</text>

    <rect x="350" y="430" width="140" height="35" rx="4" fill="#8b5cf6" filter="url(#shadow)"/>
    <text x="420" y="452" text-anchor="middle" font-size="10" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Arbitrum Sepolia</text>

    <rect x="510" y="430" width="120" height="35" rx="4" fill="#10b981" filter="url(#shadow)"/>
    <text x="570" y="452" text-anchor="middle" font-size="10" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SDK FHE</text>

    <rect x="650" y="430" width="120" height="35" rx="4" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="710" y="452" text-anchor="middle" font-size="10" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif">SendGrid</text>

    <!-- Flow arrows -->
    <path d="M 450 130 L 450 150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 300 250 L 300 270" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 550 320 L 570 320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 700 320 L 720 320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 300 370 L 300 390" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
