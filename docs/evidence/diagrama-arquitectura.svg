<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="300" fill="#f9fafb"/>

    <!-- Docker Container Box -->
    <rect x="50" y="30" width="700" height="240" rx="10" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="70" y="55" font-family="Arial" font-size="14" fill="#6366f1" font-weight="bold">Docker Compose Environment</text>

    <!-- Django Service -->
    <rect x="100" y="80" width="180" height="100" rx="8" fill="#4f46e5"/>
    <text x="190" y="115" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Django API</text>
    <text x="190" y="135" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Port: 8000</text>
    <text x="190" y="155" font-family="Arial" font-size="11" fill="white" text-anchor="middle">REST Framework</text>
    <text x="190" y="170" font-family="Arial" font-size="10" fill="#c7d2fe" text-anchor="middle">xcapit-fhe-django-dev</text>

    <!-- PostgreSQL -->
    <rect x="320" y="80" width="150" height="100" rx="8" fill="#0ea5e9"/>
    <text x="395" y="115" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="395" y="135" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Port: 5432</text>
    <text x="395" y="155" font-family="Arial" font-size="11" fill="white" text-anchor="middle">v16-alpine</text>
    <text x="395" y="170" font-family="Arial" font-size="10" fill="#bae6fd" text-anchor="middle">xcapit-fhe-postgres-dev</text>

    <!-- Redis -->
    <rect x="510" y="80" width="150" height="100" rx="8" fill="#ef4444"/>
    <text x="585" y="115" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Redis</text>
    <text x="585" y="135" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Port: 6379</text>
    <text x="585" y="155" font-family="Arial" font-size="11" fill="white" text-anchor="middle">v7-alpine</text>
    <text x="585" y="170" font-family="Arial" font-size="10" fill="#fecaca" text-anchor="middle">xcapit-fhe-redis-dev</text>

    <!-- Arrows -->
    <path d="M 280 130 L 320 130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 280 130 L 300 130 L 300 200 L 510 200 L 510 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Client -->
    <rect x="100" y="210" width="120" height="50" rx="8" fill="#10b981"/>
    <text x="160" y="235" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Test Client</text>
    <text x="160" y="250" font-family="Arial" font-size="10" fill="white" text-anchor="middle">curl / HTTP</text>

    <!-- Arrow from client -->
    <path d="M 160 210 L 160 180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-green)"/>

    <!-- Arrow markers -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
        </marker>
        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
        </marker>
    </defs>
</svg>
