<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="900" height="700" fill="#f9fafb"/>

    <!-- Title -->
    <text x="450" y="15" font-family="Arial" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Diagrama de Secuencia - Interacciones entre Actores</text>

    <!-- Actors -->
    <rect x="80" y="30" width="100" height="40" rx="5" fill="#4f46e5"/>
    <text x="130" y="55" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Alpha</text>

    <rect x="280" y="30" width="100" height="40" rx="5" fill="#0ea5e9"/>
    <text x="330" y="55" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Beta</text>

    <rect x="480" y="30" width="100" height="40" rx="5" fill="#0ea5e9"/>
    <text x="530" y="55" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Gamma</text>

    <rect x="680" y="30" width="100" height="40" rx="5" fill="#10b981"/>
    <text x="730" y="55" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">API Server</text>

    <!-- Lifelines -->
    <line x1="130" y1="70" x2="130" y2="680" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="330" y1="70" x2="330" y2="680" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="530" y1="70" x2="530" y2="680" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="730" y1="70" x2="730" y2="680" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Interaction 1: Auth -->
    <text x="50" y="105" font-family="Arial" font-size="10" fill="#6b7280">1.</text>
    <line x1="130" y1="110" x2="730" y2="110" stroke="#374151" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="400" y="105" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /auth/token/ (todos)</text>
    <line x1="730" y1="125" x2="130" y2="125" stroke="#374151" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>
    <text x="400" y="138" font-family="Arial" font-size="9" fill="#10b981" text-anchor="middle">JWT tokens</text>

    <!-- Interaction 2: Create Consortium -->
    <text x="50" y="170" font-family="Arial" font-size="10" fill="#6b7280">2.</text>
    <line x1="130" y1="175" x2="730" y2="175" stroke="#4f46e5" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="400" y="170" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /consortiums/</text>
    <line x1="730" y1="190" x2="130" y2="190" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>
    <text x="400" y="203" font-family="Arial" font-size="9" fill="#10b981" text-anchor="middle">201 Created (consortium_id)</text>

    <!-- Interaction 3: Invite Beta -->
    <text x="50" y="235" font-family="Arial" font-size="10" fill="#6b7280">3.</text>
    <line x1="130" y1="240" x2="730" y2="240" stroke="#4f46e5" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="400" y="235" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /invitations/ (invite Beta)</text>
    <line x1="730" y1="255" x2="130" y2="255" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>

    <!-- Interaction 4: Invite Gamma -->
    <text x="50" y="285" font-family="Arial" font-size="10" fill="#6b7280">4.</text>
    <line x1="130" y1="290" x2="730" y2="290" stroke="#4f46e5" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="400" y="285" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /invitations/ (invite Gamma)</text>
    <line x1="730" y1="305" x2="130" y2="305" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>

    <!-- Interaction 5: Beta gets invitations -->
    <text x="50" y="340" font-family="Arial" font-size="10" fill="#6b7280">5.</text>
    <line x1="330" y1="345" x2="730" y2="345" stroke="#0ea5e9" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="530" y="340" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">GET /invitations/received/</text>
    <line x1="730" y1="360" x2="330" y2="360" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>

    <!-- Interaction 6: Beta accepts -->
    <text x="50" y="390" font-family="Arial" font-size="10" fill="#6b7280">6.</text>
    <line x1="330" y1="395" x2="730" y2="395" stroke="#0ea5e9" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="530" y="390" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /invitations/{id}/accept/</text>
    <line x1="730" y1="410" x2="330" y2="410" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>
    <text x="530" y="423" font-family="Arial" font-size="9" fill="#10b981" text-anchor="middle">"Invitation accepted"</text>

    <!-- Interaction 7: Gamma accepts -->
    <text x="50" y="450" font-family="Arial" font-size="10" fill="#6b7280">7.</text>
    <line x1="530" y1="455" x2="730" y2="455" stroke="#0ea5e9" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="630" y="450" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /invitations/{id}/accept/</text>
    <line x1="730" y1="470" x2="530" y2="470" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>

    <!-- Interaction 8-10: Contributions -->
    <rect x="100" y="495" width="650" height="60" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="425" y="515" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold">8-10. POST /contributions/ (cada hospital contribuye datos)</text>
    <text x="425" y="535" font-family="Arial" font-size="9" fill="#92400e" text-anchor="middle">Alpha: 10,000 | Beta: 8,000 | Gamma: 12,000 registros</text>

    <!-- Interaction 11: Start Training -->
    <text x="50" y="585" font-family="Arial" font-size="10" fill="#6b7280">11.</text>
    <line x1="130" y1="590" x2="730" y2="590" stroke="#4f46e5" stroke-width="1" marker-end="url(#seq-arrow)"/>
    <text x="400" y="585" font-family="Arial" font-size="10" fill="#374151" text-anchor="middle">POST /consortiums/{id}/start_training/</text>
    <line x1="730" y1="605" x2="130" y2="605" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#seq-arrow)"/>
    <text x="400" y="618" font-family="Arial" font-size="9" fill="#10b981" text-anchor="middle">"Training started" status: training</text>

    <!-- Final state -->
    <rect x="600" y="640" width="180" height="50" rx="5" fill="#d1fae5" stroke="#10b981"/>
    <text x="690" y="660" font-family="Arial" font-size="11" fill="#065f46" text-anchor="middle" font-weight="bold">Estado Final:</text>
    <text x="690" y="678" font-family="Arial" font-size="10" fill="#065f46" text-anchor="middle">3 miembros, 30K registros, training</text>

    <!-- Arrow marker -->
    <defs>
        <marker id="seq-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
        </marker>
    </defs>
</svg>
