<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="900" height="600" fill="#f9fafb"/>

    <!-- Title -->
    <text x="450" y="25" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle" font-weight="bold">Flujo Completo de Creacion y Gestion del Consorcio</text>

    <!-- Start -->
    <ellipse cx="100" cy="70" rx="60" ry="25" fill="#10b981"/>
    <text x="100" y="75" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">INICIO</text>

    <!-- Step 1: Auth -->
    <rect x="40" y="120" width="120" height="50" rx="5" fill="#4f46e5"/>
    <text x="100" y="140" font-family="Arial" font-size="11" fill="white" text-anchor="middle">1. Autenticacion</text>
    <text x="100" y="155" font-family="Arial" font-size="9" fill="#c7d2fe" text-anchor="middle">JWT Tokens</text>
    <path d="M 100 95 L 100 120" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2: Create Consortium -->
    <rect x="40" y="200" width="120" height="50" rx="5" fill="#4f46e5"/>
    <text x="100" y="220" font-family="Arial" font-size="11" fill="white" text-anchor="middle">2. Crear Consorcio</text>
    <text x="100" y="235" font-family="Arial" font-size="9" fill="#c7d2fe" text-anchor="middle">Hospital Alpha</text>
    <path d="M 100 170 L 100 200" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3: Invitations -->
    <rect x="40" y="280" width="120" height="50" rx="5" fill="#4f46e5"/>
    <text x="100" y="300" font-family="Arial" font-size="11" fill="white" text-anchor="middle">3. Enviar</text>
    <text x="100" y="315" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Invitaciones</text>
    <path d="M 100 250 L 100 280" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Branch to Beta and Gamma -->
    <path d="M 160 305 L 250 305" stroke="#6366f1" stroke-width="2"/>
    <path d="M 250 305 L 250 240 L 320 240" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250 305 L 250 370 L 320 370" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Beta accepts -->
    <rect x="320" y="215" width="130" height="50" rx="5" fill="#0ea5e9"/>
    <text x="385" y="235" font-family="Arial" font-size="11" fill="white" text-anchor="middle">4a. Beta Acepta</text>
    <text x="385" y="250" font-family="Arial" font-size="9" fill="#bae6fd" text-anchor="middle">Invitacion</text>

    <!-- Gamma accepts -->
    <rect x="320" y="345" width="130" height="50" rx="5" fill="#0ea5e9"/>
    <text x="385" y="365" font-family="Arial" font-size="11" fill="white" text-anchor="middle">4b. Gamma Acepta</text>
    <text x="385" y="380" font-family="Arial" font-size="9" fill="#bae6fd" text-anchor="middle">Invitacion</text>

    <!-- Merge -->
    <path d="M 450 240 L 500 240 L 500 305" stroke="#6366f1" stroke-width="2"/>
    <path d="M 450 370 L 500 370 L 500 305" stroke="#6366f1" stroke-width="2"/>
    <path d="M 500 305 L 550 305" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 5: Contributions -->
    <rect x="550" y="280" width="130" height="50" rx="5" fill="#f59e0b"/>
    <text x="615" y="300" font-family="Arial" font-size="11" fill="white" text-anchor="middle">5. Contribuciones</text>
    <text x="615" y="315" font-family="Arial" font-size="9" fill="#fef3c7" text-anchor="middle">30,000 registros</text>

    <!-- Contribution details -->
    <rect x="720" y="200" width="120" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="780" y="222" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle">Alpha: 10,000</text>

    <rect x="720" y="245" width="120" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="780" y="267" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle">Beta: 8,000</text>

    <rect x="720" y="290" width="120" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="780" y="312" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle">Gamma: 12,000</text>

    <path d="M 680 305 L 720 260" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Step 6: Activate -->
    <rect x="550" y="360" width="130" height="50" rx="5" fill="#8b5cf6"/>
    <text x="615" y="380" font-family="Arial" font-size="11" fill="white" text-anchor="middle">6. Activar</text>
    <text x="615" y="395" font-family="Arial" font-size="9" fill="#ddd6fe" text-anchor="middle">Consorcio</text>
    <path d="M 615 330 L 615 360" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 7: Training -->
    <rect x="550" y="440" width="130" height="50" rx="5" fill="#10b981"/>
    <text x="615" y="460" font-family="Arial" font-size="11" fill="white" text-anchor="middle">7. Iniciar</text>
    <text x="615" y="475" font-family="Arial" font-size="9" fill="#d1fae5" text-anchor="middle">Entrenamiento</text>
    <path d="M 615 410 L 615 440" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- End -->
    <ellipse cx="615" cy="540" rx="60" ry="25" fill="#10b981"/>
    <text x="615" y="545" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">FIN</text>
    <path d="M 615 490 L 615 515" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Legend -->
    <rect x="40" y="480" width="200" height="100" rx="5" fill="white" stroke="#e5e7eb"/>
    <text x="55" y="500" font-family="Arial" font-size="11" fill="#374151" font-weight="bold">Leyenda:</text>
    <rect x="55" y="510" width="15" height="15" fill="#4f46e5"/>
    <text x="80" y="522" font-family="Arial" font-size="10" fill="#374151">Hospital Alpha (Owner)</text>
    <rect x="55" y="530" width="15" height="15" fill="#0ea5e9"/>
    <text x="80" y="542" font-family="Arial" font-size="10" fill="#374151">Beta/Gamma (Miembros)</text>
    <rect x="55" y="550" width="15" height="15" fill="#f59e0b"/>
    <text x="80" y="562" font-family="Arial" font-size="10" fill="#374151">Contribuciones</text>

    <!-- Arrow marker -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
        </marker>
        <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
        </marker>
    </defs>
</svg>
