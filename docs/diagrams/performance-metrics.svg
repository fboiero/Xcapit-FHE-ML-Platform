<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="15"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    Métricas de Performance - Xcapit FHE-ML
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">
    Tiempos de ejecución por operación (milisegundos)
  </text>

  <!-- Chart area -->
  <rect x="100" y="90" width="600" height="280" fill="rgba(0,0,0,0.2)" rx="10"/>

  <!-- Y-axis labels -->
  <text x="90" y="115" text-anchor="end" fill="#64748B" font-family="Arial, sans-serif" font-size="11">100ms</text>
  <text x="90" y="185" text-anchor="end" fill="#64748B" font-family="Arial, sans-serif" font-size="11">75ms</text>
  <text x="90" y="255" text-anchor="end" fill="#64748B" font-family="Arial, sans-serif" font-size="11">50ms</text>
  <text x="90" y="325" text-anchor="end" fill="#64748B" font-family="Arial, sans-serif" font-size="11">25ms</text>
  <text x="90" y="365" text-anchor="end" fill="#64748B" font-family="Arial, sans-serif" font-size="11">0ms</text>

  <!-- Grid lines -->
  <line x1="100" y1="110" x2="700" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="180" x2="700" y2="180" stroke="#374151" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="#374151" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="#374151" stroke-width="1" stroke-dasharray="4"/>

  <!-- Bars -->
  <!-- Encryption: 12ms (height = 12/100 * 260 = 31) -->
  <rect x="150" y="329" width="80" height="31" fill="url(#bar1)" rx="5"/>
  <text x="190" y="320" text-anchor="middle" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="14" font-weight="bold">12ms</text>

  <!-- Linear Regression: 28ms -->
  <rect x="280" y="287" width="80" height="73" fill="url(#bar2)" rx="5"/>
  <text x="320" y="278" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">28ms</text>

  <!-- Logistic Regression: 45ms -->
  <rect x="410" y="243" width="80" height="117" fill="url(#bar3)" rx="5"/>
  <text x="450" y="234" text-anchor="middle" fill="#06B6D4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">45ms</text>

  <!-- Decision Tree: 85ms -->
  <rect x="540" y="139" width="80" height="221" fill="url(#bar4)" rx="5"/>
  <text x="580" y="130" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">85ms</text>

  <!-- X-axis labels -->
  <text x="190" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">Encriptación</text>
  <text x="190" y="405" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="10">CKKS</text>

  <text x="320" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">Linear</text>
  <text x="320" y="405" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="10">Regression</text>

  <text x="450" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">Logistic</text>
  <text x="450" y="405" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="10">Regression</text>

  <text x="580" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">Decision</text>
  <text x="580" y="405" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="10">Tree</text>

  <!-- Legend -->
  <rect x="100" y="425" width="600" height="20" fill="rgba(16,185,129,0.1)" rx="5"/>
  <text x="400" y="439" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="11">
    Benchmark: Intel i7-12700K, 32GB RAM, TenSEAL v0.3.14, poly_degree=8192
  </text>
</svg>
