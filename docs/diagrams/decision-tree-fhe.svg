<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="probGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Arbol de Decision en FHE: Comparaciones Suaves
  </text>
  <text x="450" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    Todas las ramas se evaluan y combinan con probabilidades
  </text>

  <!-- Traditional Tree Section -->
  <rect x="30" y="75" width="400" height="200" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="230" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">
    Arbol Tradicional (NO funciona en FHE)
  </text>

  <!-- Traditional tree nodes -->
  <g transform="translate(180, 115)">
    <rect x="0" y="0" width="100" height="35" rx="6" fill="#F59E0B"/>
    <text x="50" y="22" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">x[0] &lt;= 5?</text>
  </g>

  <line x1="180" y1="150" x2="130" y2="180" stroke="#92400E" stroke-width="2"/>
  <line x1="280" y1="150" x2="330" y2="180" stroke="#92400E" stroke-width="2"/>

  <text x="145" y="165" font-family="Arial, sans-serif" font-size="10" fill="#92400E">Si</text>
  <text x="305" y="165" font-family="Arial, sans-serif" font-size="10" fill="#92400E">No</text>

  <g transform="translate(80, 185)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#10B981"/>
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Clase A</text>
  </g>

  <g transform="translate(300, 185)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#EF4444"/>
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Clase B</text>
  </g>

  <text x="230" y="245" font-family="Arial, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">
    Problema: Comparacion requiere ver x[0]
  </text>
  <text x="230" y="260" font-family="Arial, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">
    pero x[0] esta encriptado
  </text>

  <!-- FHE Tree Section -->
  <rect x="470" y="75" width="400" height="200" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="670" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">
    Arbol FHE (Comparaciones Suaves)
  </text>

  <!-- FHE tree nodes -->
  <g transform="translate(620, 115)">
    <rect x="0" y="0" width="100" height="35" rx="6" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">P = sigma(5-x[0])</text>
    <text x="50" y="28" font-family="monospace" font-size="8" fill="#BFDBFE" text-anchor="middle">soft compare</text>
  </g>

  <line x1="620" y1="150" x2="570" y2="180" stroke="#3B82F6" stroke-width="2"/>
  <line x1="720" y1="150" x2="770" y2="180" stroke="#3B82F6" stroke-width="2"/>

  <text x="575" y="165" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6">P</text>
  <text x="755" y="165" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6">1-P</text>

  <g transform="translate(520, 185)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#leafGrad)"/>
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">v_A = 1</text>
  </g>

  <g transform="translate(740, 185)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#leafGrad)"/>
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">v_B = 0</text>
  </g>

  <text x="670" y="245" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">
    Resultado = P * v_A + (1-P) * v_B
  </text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">
    Ambas ramas evaluadas, ponderadas
  </text>

  <!-- Formula Section -->
  <rect x="30" y="290" width="840" height="120" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <text x="450" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Formula de Comparacion Suave
  </text>

  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="380" height="55" rx="8" fill="#EEF2FF"/>
    <text x="190" y="22" font-family="monospace" font-size="12" fill="#4338CA" text-anchor="middle">
      P(x &lt;= threshold) = sigma(beta * (threshold - x))
    </text>
    <text x="190" y="42" font-family="Arial, sans-serif" font-size="10" fill="#6366F1" text-anchor="middle">
      beta controla la "dureza" de la comparacion
    </text>
  </g>

  <g transform="translate(470, 340)">
    <rect x="0" y="0" width="380" height="55" rx="8" fill="#F0FDF4"/>
    <text x="190" y="22" font-family="monospace" font-size="12" fill="#166534" text-anchor="middle">
      resultado = P * valor_izq + (1-P) * valor_der
    </text>
    <text x="190" y="42" font-family="Arial, sans-serif" font-size="10" fill="#22C55E" text-anchor="middle">
      Combinacion ponderada de todas las ramas
    </text>
  </g>

  <!-- Example Section -->
  <rect x="30" y="425" width="840" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <text x="450" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Ejemplo Numerico
  </text>

  <g transform="translate(50, 465)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      Entrada encriptada: E(x[0]) donde x[0] = 3
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      Threshold = 5, beta = 2
    </text>
    <text x="0" y="55" font-family="monospace" font-size="11" fill="#4338CA">
      P = sigma(2 * (5 - 3)) = sigma(4) = 0.982
    </text>
  </g>

  <g transform="translate(450, 465)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      Valores de hojas: v_A = 1 (izq), v_B = 0 (der)
    </text>
    <text x="0" y="35" font-family="monospace" font-size="11" fill="#166534">
      resultado = 0.982 * 1 + 0.018 * 0 = 0.982
    </text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      Interpretacion: 98.2% probabilidad Clase A
    </text>
  </g>

</svg>
