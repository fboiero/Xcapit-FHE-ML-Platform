<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fheGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="blockchainGrad" x1="0%" y1="0%" x2="0%"  y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Flujo Completo: ¿Cuándo se usa FHE y cuándo Blockchain?</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Paso a paso del proceso de entrenamiento colaborativo con privacidad</text>

  <!-- Legend -->
  <rect x="30" y="80" width="180" height="100" rx="8" fill="rgba(255,255,255,0.05)" stroke="#475569"/>
  <text x="120" y="100" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LEYENDA</text>
  <rect x="45" y="115" width="20" height="12" rx="3" fill="url(#fheGrad)"/>
  <text x="75" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="11">= FHE (Encriptación)</text>
  <rect x="45" y="135" width="20" height="12" rx="3" fill="url(#blockchainGrad)"/>
  <text x="75" y="145" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11">= Blockchain</text>
  <rect x="45" y="155" width="20" height="12" rx="3" fill="url(#userGrad)"/>
  <text x="75" y="165" fill="#3b82f6" font-family="Arial, sans-serif" font-size="11">= Cliente/Banco</text>

  <!-- Timeline line -->
  <line x1="100" y1="220" x2="1100" y2="220" stroke="#475569" stroke-width="3"/>
  <text x="100" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">INICIO</text>
  <text x="1060" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">FIN</text>

  <!-- STEP 1: Bank has data -->
  <circle cx="150" cy="220" r="20" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="150" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1</text>

  <rect x="90" y="250" width="120" height="100" rx="8" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="150" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🏦 BANCO</text>
  <text x="150" y="295" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="10">Tiene datos</text>
  <text x="150" y="310" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="10">sensibles en</text>
  <text x="150" y="325" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TEXTO PLANO</text>
  <text x="150" y="340" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="9">⚠️ Vulnerable</text>

  <!-- Arrow 1->2 -->
  <path d="M210 300 L270 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="240" y="290" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="9">FHE</text>

  <!-- STEP 2: Encrypt with FHE -->
  <circle cx="320" cy="220" r="20" fill="url(#fheGrad)" filter="url(#shadow)"/>
  <text x="320" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2</text>

  <rect x="260" y="250" width="120" height="120" rx="8" fill="url(#fheGrad)" filter="url(#shadow)"/>
  <text x="320" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔐 ENCRIPTAR</text>
  <text x="320" y="295" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="10">FHE (TenSEAL)</text>
  <text x="320" y="315" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9">CKKS Scheme</text>
  <text x="320" y="335" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9">128-bit security</text>
  <rect x="275" y="345" width="90" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
  <text x="320" y="358" text-anchor="middle" fill="#ecfdf5" font-family="Courier, monospace" font-size="8">0x7a3f8c2d...</text>

  <!-- Arrow 2->3 -->
  <path d="M380 300 L440 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STEP 3: Send encrypted to server -->
  <circle cx="490" cy="220" r="20" fill="url(#serverGrad)" filter="url(#shadow)"/>
  <text x="490" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3</text>

  <rect x="430" y="250" width="120" height="100" rx="8" fill="url(#serverGrad)" filter="url(#shadow)"/>
  <text x="490" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">☁️ SERVIDOR</text>
  <text x="490" y="295" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="10">Recibe datos</text>
  <text x="490" y="310" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CIFRADOS</text>
  <text x="490" y="330" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="9">✅ No puede leerlos</text>
  <text x="490" y="345" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="9">✅ Pero puede operar</text>

  <!-- Arrow 3->4 -->
  <path d="M550 300 L610 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="580" y="290" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="9">FHE</text>

  <!-- STEP 4: Train on encrypted -->
  <circle cx="660" cy="220" r="20" fill="url(#fheGrad)" filter="url(#shadow)"/>
  <text x="660" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4</text>

  <rect x="600" y="250" width="120" height="120" rx="8" fill="url(#fheGrad)" filter="url(#shadow)"/>
  <text x="660" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📈 ENTRENAR</text>
  <text x="660" y="295" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="10">ML sobre cifrado</text>
  <text x="660" y="315" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9">Logistic Regression</text>
  <text x="660" y="335" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="9">enc_z = enc_X @ W</text>
  <rect x="615" y="345" width="90" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
  <text x="660" y="358" text-anchor="middle" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="8">Accuracy: 94.5%</text>

  <!-- Arrow 4->5 -->
  <path d="M720 300 L780 300" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="750" y="290" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9">BC</text>

  <!-- STEP 5: Register on blockchain -->
  <circle cx="830" cy="220" r="20" fill="url(#blockchainGrad)" filter="url(#shadow)"/>
  <text x="830" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">5</text>

  <rect x="770" y="250" width="120" height="120" rx="8" fill="url(#blockchainGrad)" filter="url(#shadow)"/>
  <text x="830" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">⛓️ REGISTRAR</text>
  <text x="830" y="295" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">En Blockchain</text>
  <text x="830" y="315" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="9">ModelRegistry.sol</text>
  <text x="830" y="335" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="9">Guarda:</text>
  <text x="830" y="350" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="8">• Hash del modelo</text>
  <text x="830" y="363" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="8">• Métricas • Timestamp</text>

  <!-- Arrow 5->6 -->
  <path d="M890 300 L950 300" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="920" y="290" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9">BC</text>

  <!-- STEP 6: Governance voting -->
  <circle cx="1000" cy="220" r="20" fill="url(#blockchainGrad)" filter="url(#shadow)"/>
  <text x="1000" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">6</text>

  <rect x="940" y="250" width="120" height="120" rx="8" fill="url(#blockchainGrad)" filter="url(#shadow)"/>
  <text x="1000" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🗳️ VOTAR</text>
  <text x="1000" y="295" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">Governance</text>
  <text x="1000" y="315" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="9">Commit-Reveal</text>
  <text x="1000" y="335" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="8">1. Commit hash voto</text>
  <text x="1000" y="350" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="8">2. Reveal voto real</text>
  <text x="1000" y="363" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="8">3. Contar y ejecutar</text>

  <!-- BOTTOM SECTION: What blockchain stores vs what FHE protects -->

  <!-- Divider -->
  <line x1="50" y1="420" x2="1150" y2="420" stroke="#475569" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- FHE Section -->
  <rect x="50" y="450" width="530" height="200" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="2"/>
  <text x="315" y="480" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🔐 ¿QUÉ PROTEGE FHE?</text>

  <text x="80" y="510" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Datos que NUNCA salen en texto plano:</text>

  <rect x="80" y="525" width="220" height="110" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="190" y="545" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Transacciones bancarias</text>
  <text x="100" y="565" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Montos: $523.45 → 🔒</text>
  <text x="100" y="582" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Ubicaciones → 🔒</text>
  <text x="100" y="599" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Patrones de gasto → 🔒</text>
  <text x="100" y="616" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Datos personales → 🔒</text>

  <rect x="320" y="525" width="240" height="110" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="440" y="545" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Proceso de ML</text>
  <text x="340" y="565" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Features de entrada → 🔒</text>
  <text x="340" y="582" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Cálculos intermedios → 🔒</text>
  <text x="340" y="599" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Predicciones individuales → 🔒</text>
  <text x="340" y="616" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="10">• Solo el banco descifra resultado</text>

  <!-- Blockchain Section -->
  <rect x="620" y="450" width="530" height="200" rx="12" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="2"/>
  <text x="885" y="480" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">⛓️ ¿QUÉ GUARDA BLOCKCHAIN?</text>

  <text x="650" y="510" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Metadatos públicos y auditables:</text>

  <rect x="650" y="525" width="220" height="110" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="760" y="545" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">ModelRegistry</text>
  <text x="670" y="565" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Hash del modelo (SHA-256)</text>
  <text x="670" y="582" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Accuracy: 94.5%</text>
  <text x="670" y="599" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Timestamp de creación</text>
  <text x="670" y="616" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Versión del modelo</text>

  <rect x="890" y="525" width="240" height="110" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="1010" y="545" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">ConsortiumGovernance</text>
  <text x="910" y="565" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Lista de miembros (wallets)</text>
  <text x="910" y="582" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Propuestas y votos</text>
  <text x="910" y="599" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Resultados de votación</text>
  <text x="910" y="616" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10">• Audit trail inmutable</text>

  <!-- Bottom comparison -->
  <rect x="50" y="680" width="1100" height="80" rx="12" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="710" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🎯 RESUMEN: SEPARACIÓN DE RESPONSABILIDADES</text>

  <text x="300" y="740" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12">FHE = Privacidad de DATOS</text>
  <text x="300" y="755" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="10">(nadie ve tus transacciones)</text>

  <text x="600" y="740" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">+</text>

  <text x="900" y="740" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12">Blockchain = Transparencia de PROCESO</text>
  <text x="900" y="755" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="10">(todos ven que el modelo es legítimo)</text>

  <!-- Key insight box -->
  <rect x="50" y="780" width="1100" height="50" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="810" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">💡 CLAVE: Los datos NUNCA tocan la blockchain. La blockchain solo registra PRUEBAS de que el proceso fue correcto.</text>
</svg>
