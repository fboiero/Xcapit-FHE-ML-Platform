<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="550" viewBox="0 0 850 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="commitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="revealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="550" fill="#0f172a"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Commit-Reveal Voting Scheme</text>
  <text x="425" y="58" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Prevents front-running by hiding votes until reveal phase</text>

  <!-- Timeline -->
  <line x1="50" y1="95" x2="800" y2="95" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="95" r="8" fill="#f59e0b"/>
  <circle cx="425" cy="95" r="8" fill="#64748b"/>
  <circle cx="650" cy="95" r="8" fill="#10b981"/>

  <text x="200" y="115" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11">Commit Start</text>
  <text x="425" y="115" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Commit Deadline</text>
  <text x="650" y="115" text-anchor="middle" fill="#34d399" font-family="Arial, sans-serif" font-size="11">Reveal Deadline</text>

  <!-- Phase 1: Commit -->
  <rect x="50" y="140" width="350" height="180" rx="12" fill="url(#commitGrad)" filter="url(#shadow)"/>
  <text x="225" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🔒 PHASE 1: COMMIT</text>
  <text x="225" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Votes are cryptographically hidden</text>

  <!-- Bank commits -->
  <rect x="70" y="205" width="310" height="100" rx="6" fill="rgba(0,0,0,0.3)"/>

  <text x="85" y="230" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Alpha:</text>
  <text x="170" y="230" fill="#fde68a" font-family="Courier, monospace" font-size="10">commit(0x5f93bee2...)</text>
  <text x="340" y="230" fill="#fed7aa" font-family="Arial, sans-serif" font-size="10">vote: ???</text>

  <text x="85" y="255" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Beta:</text>
  <text x="170" y="255" fill="#fde68a" font-family="Courier, monospace" font-size="10">commit(0x891ba778...)</text>
  <text x="340" y="255" fill="#fed7aa" font-family="Arial, sans-serif" font-size="10">vote: ???</text>

  <text x="85" y="280" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Gamma:</text>
  <text x="170" y="280" fill="#fde68a" font-family="Courier, monospace" font-size="10">commit(0x30093675...)</text>
  <text x="340" y="280" fill="#fed7aa" font-family="Arial, sans-serif" font-size="10">vote: ???</text>

  <!-- Formula box -->
  <rect x="70" y="310" width="310" height="25" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="225" y="327" text-anchor="middle" fill="#fef3c7" font-family="Courier, monospace" font-size="10">commitment = hash(proposalId + vote + salt)</text>

  <!-- Arrow between phases -->
  <path d="M400 230 L450 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="220" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">24h</text>

  <!-- Phase 2: Reveal -->
  <rect x="450" y="140" width="350" height="180" rx="12" fill="url(#revealGrad)" filter="url(#shadow)"/>
  <text x="625" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🔓 PHASE 2: REVEAL</text>
  <text x="625" y="190" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="11">Votes are verified and counted</text>

  <!-- Bank reveals -->
  <rect x="470" y="205" width="310" height="100" rx="6" fill="rgba(0,0,0,0.3)"/>

  <text x="485" y="230" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Alpha:</text>
  <text x="580" y="230" fill="#86efac" font-family="Arial, sans-serif" font-size="11">✅ YES</text>
  <text x="640" y="230" fill="#a7f3d0" font-family="Courier, monospace" font-size="9">✓ Verified</text>

  <text x="485" y="255" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Beta:</text>
  <text x="580" y="255" fill="#86efac" font-family="Arial, sans-serif" font-size="11">✅ YES</text>
  <text x="640" y="255" fill="#a7f3d0" font-family="Courier, monospace" font-size="9">✓ Verified</text>

  <text x="485" y="280" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank Gamma:</text>
  <text x="580" y="280" fill="#86efac" font-family="Arial, sans-serif" font-size="11">✅ YES</text>
  <text x="640" y="280" fill="#a7f3d0" font-family="Courier, monospace" font-size="9">✓ Verified</text>

  <!-- Verification formula -->
  <rect x="470" y="310" width="310" height="25" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="625" y="327" text-anchor="middle" fill="#d1fae5" font-family="Courier, monospace" font-size="10">verify: hash(id + vote + salt) == commitment</text>

  <!-- Arrow to result -->
  <path d="M425 350 L425 390" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="200" y="400" width="450" height="130" rx="12" fill="url(#resultGrad)" filter="url(#shadow)"/>
  <text x="425" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">📊 VOTING RESULT</text>

  <rect x="220" y="445" width="200" height="70" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="320" y="470" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="14">YES: 3 votes</text>
  <text x="320" y="490" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="14">NO: 0 votes</text>
  <text x="320" y="510" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="11">Quorum: 100%</text>

  <rect x="440" y="445" width="190" height="70" rx="6" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="2"/>
  <text x="535" y="480" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="20" font-weight="bold">✅ PASSED</text>
  <text x="535" y="505" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="11">100% > 51% required</text>

  <!-- Why commit-reveal box -->
  <rect x="50" y="350" width="130" height="80" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
  <text x="115" y="375" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Why Commit-Reveal?</text>
  <text x="60" y="395" fill="#fecaca" font-family="Arial, sans-serif" font-size="9">Prevents:</text>
  <text x="60" y="410" fill="#fecaca" font-family="Arial, sans-serif" font-size="9">• Front-running</text>
  <text x="60" y="425" fill="#fecaca" font-family="Arial, sans-serif" font-size="9">• Vote manipulation</text>
</svg>
