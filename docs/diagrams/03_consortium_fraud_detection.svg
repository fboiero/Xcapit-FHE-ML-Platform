<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bankAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bankBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bankCGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="encryptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Consortium: Fraud Detection (LatAm Banks)</text>

  <!-- Bank Alpha (Argentina) -->
  <rect x="50" y="80" width="220" height="180" rx="12" fill="url(#bankAGrad)" filter="url(#shadow)"/>
  <text x="160" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🇦🇷 Bank Alpha</text>
  <text x="160" y="130" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="12">Argentina</text>

  <rect x="65" y="145" width="190" height="100" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="160" y="168" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Plaintext Data</text>
  <text x="75" y="190" fill="#eff6ff" font-family="Courier, monospace" font-size="10">Transactions: 400</text>
  <text x="75" y="207" fill="#eff6ff" font-family="Courier, monospace" font-size="10">Fraud cases: 28 (7%)</text>
  <text x="75" y="224" fill="#eff6ff" font-family="Courier, monospace" font-size="10">Features: 10</text>
  <text x="75" y="241" fill="#fca5a5" font-family="Courier, monospace" font-size="9">⚠️ Never leaves bank</text>

  <!-- Bank Beta (Chile) -->
  <rect x="340" y="80" width="220" height="180" rx="12" fill="url(#bankBGrad)" filter="url(#shadow)"/>
  <text x="450" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🇨🇱 Bank Beta</text>
  <text x="450" y="130" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="12">Chile</text>

  <rect x="355" y="145" width="190" height="100" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="450" y="168" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Plaintext Data</text>
  <text x="365" y="190" fill="#f5f3ff" font-family="Courier, monospace" font-size="10">Transactions: 300</text>
  <text x="365" y="207" fill="#f5f3ff" font-family="Courier, monospace" font-size="10">Fraud cases: 15 (5%)</text>
  <text x="365" y="224" fill="#f5f3ff" font-family="Courier, monospace" font-size="10">Features: 10</text>
  <text x="365" y="241" fill="#fca5a5" font-family="Courier, monospace" font-size="9">⚠️ Never leaves bank</text>

  <!-- Bank Gamma (Mexico) -->
  <rect x="630" y="80" width="220" height="180" rx="12" fill="url(#bankCGrad)" filter="url(#shadow)"/>
  <text x="740" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🇲🇽 Bank Gamma</text>
  <text x="740" y="130" text-anchor="middle" fill="#fbcfe8" font-family="Arial, sans-serif" font-size="12">Mexico</text>

  <rect x="645" y="145" width="190" height="100" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="740" y="168" text-anchor="middle" fill="#fce7f3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Plaintext Data</text>
  <text x="655" y="190" fill="#fdf2f8" font-family="Courier, monospace" font-size="10">Transactions: 300</text>
  <text x="655" y="207" fill="#fdf2f8" font-family="Courier, monospace" font-size="10">Fraud cases: 11 (3.7%)</text>
  <text x="655" y="224" fill="#fdf2f8" font-family="Courier, monospace" font-size="10">Features: 10</text>
  <text x="655" y="241" fill="#fca5a5" font-family="Courier, monospace" font-size="9">⚠️ Never leaves bank</text>

  <!-- Encryption arrows -->
  <path d="M160 260 L160 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 260 L450 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M740 260 L740 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Encrypt boxes -->
  <rect x="110" y="305" width="100" height="40" rx="6" fill="url(#encryptGrad)" filter="url(#shadow)"/>
  <text x="160" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔐 Encrypt</text>

  <rect x="400" y="305" width="100" height="40" rx="6" fill="url(#encryptGrad)" filter="url(#shadow)"/>
  <text x="450" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔐 Encrypt</text>

  <rect x="690" y="305" width="100" height="40" rx="6" fill="url(#encryptGrad)" filter="url(#shadow)"/>
  <text x="740" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔐 Encrypt</text>

  <!-- Arrows to pool -->
  <path d="M160 345 L160 380 L450 400" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M450 345 L450 400" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M740 345 L740 380 L450 400" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- Encrypted Pool -->
  <rect x="250" y="400" width="400" height="80" rx="12" fill="url(#poolGrad)" filter="url(#shadow)"/>
  <text x="450" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🔒 Encrypted Data Pool</text>
  <text x="450" y="455" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12">1,000 transactions (ciphertext only)</text>
  <text x="450" y="472" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="10">Combined without exposing raw data</text>

  <!-- Arrow to model -->
  <path d="M450 480 L450 520" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Model Training -->
  <rect x="250" y="530" width="400" height="100" rx="12" fill="url(#modelGrad)" filter="url(#shadow)"/>
  <text x="450" y="560" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">📈 Train Model (on ciphertext)</text>

  <rect x="270" y="575" width="160" height="45" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="350" y="595" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="11">LogisticRegression</text>
  <text x="350" y="612" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">Accuracy: 94.5%</text>

  <rect x="470" y="575" width="160" height="45" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="550" y="595" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="11">Shared Output</text>
  <text x="550" y="612" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">Model weights only</text>

  <!-- Legend -->
  <rect x="700" y="400" width="180" height="100" rx="8" fill="rgba(255,255,255,0.05)" stroke="#475569" stroke-width="1"/>
  <text x="790" y="425" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Privacy Guarantees</text>
  <text x="715" y="450" fill="#fca5a5" font-family="Arial, sans-serif" font-size="10">❌ Raw data shared</text>
  <text x="715" y="470" fill="#86efac" font-family="Arial, sans-serif" font-size="10">✅ Only ciphertext shared</text>
  <text x="715" y="490" fill="#86efac" font-family="Arial, sans-serif" font-size="10">✅ Model params shared</text>
</svg>
