<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="encryptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Pipeline de Machine Learning con FHE
  </text>
  <text x="500" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    Entrenamiento en texto plano, Inferencia encriptada
  </text>

  <!-- Training Phase -->
  <rect x="30" y="80" width="450" height="240" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="255" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E40AF" text-anchor="middle">
    FASE DE ENTRENAMIENTO (Offline)
  </text>
  <text x="255" y="125" font-family="Arial, sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">
    Datos en texto plano - Ambiente seguro
  </text>

  <!-- Training steps -->
  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Datos</text>
    <text x="50" y="42" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Entrenamiento</text>
    <text x="50" y="55" font-family="monospace" font-size="8" fill="#BFDBFE" text-anchor="middle">X_train, y_train</text>
  </g>

  <path d="M 160 175 L 190 175" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(200, 145)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Preprocesar</text>
    <text x="50" y="42" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Normalizar</text>
    <text x="50" y="55" font-family="monospace" font-size="8" fill="#BFDBFE" text-anchor="middle">StandardScaler</text>
  </g>

  <path d="M 310 175 L 340 175" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(350, 145)">
    <rect x="0" y="0" width="110" height="60" rx="8" fill="url(#trainGrad)" filter="url(#shadow)"/>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Entrenar</text>
    <text x="55" y="42" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Modelo</text>
    <text x="55" y="55" font-family="monospace" font-size="8" fill="#BFDBFE" text-anchor="middle">model.fit()</text>
  </g>

  <!-- Model output -->
  <path d="M 405 215 L 405 245" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(320, 255)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <text x="85" y="22" font-family="Arial, sans-serif" font-size="11" fill="#1E40AF" text-anchor="middle">Modelo Entrenado</text>
    <text x="85" y="40" font-family="monospace" font-size="9" fill="#3B82F6" text-anchor="middle">weights, bias, params</text>
  </g>

  <!-- Inference Phase -->
  <rect x="520" y="80" width="460" height="500" rx="15" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
  <text x="750" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">
    FASE DE INFERENCIA (Online)
  </text>
  <text x="750" y="125" font-family="Arial, sans-serif" font-size="11" fill="#22C55E" text-anchor="middle">
    Datos encriptados - Privacy preserving
  </text>

  <!-- Client side -->
  <rect x="540" y="145" width="200" height="200" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="640" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">CLIENTE</text>

  <g transform="translate(560, 180)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#encryptGrad)"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Datos Originales</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">X_new = [1.5, 2.3, 0.7]</text>
  </g>

  <path d="M 640 230 L 640 255" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(560, 265)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#encryptGrad)"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Encriptar (CKKS)</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">E(X) = ct</text>
  </g>

  <!-- Server side -->
  <rect x="760" y="145" width="200" height="200" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="860" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">SERVIDOR</text>

  <g transform="translate(780, 180)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#D1D5DB"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Recibe E(X)</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle">[ciphertext opaco]</text>
  </g>

  <path d="M 860 230 L 860 255" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(780, 265)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#inferGrad)"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Computar FHE</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#D1FAE5" text-anchor="middle">E(y) = f(E(X))</text>
  </g>

  <!-- Arrows between client and server -->
  <path d="M 720 290 L 770 290" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="745" y="283" font-family="Arial, sans-serif" font-size="8" fill="#8B5CF6" text-anchor="middle">E(X)</text>

  <!-- Return path -->
  <path d="M 770 320 L 720 320" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="745" y="337" font-family="Arial, sans-serif" font-size="8" fill="#10B981" text-anchor="middle">E(y)</text>

  <!-- Decrypt on client -->
  <g transform="translate(560, 365)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#encryptGrad)"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Descifrar (sk)</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">y = D(E(y))</text>
  </g>

  <path d="M 640 415 L 640 440" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(560, 450)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#10B981"/>
    <text x="80" y="18" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Resultado Final</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#D1FAE5" text-anchor="middle">y = 0.847</text>
  </g>

  <!-- Model transfer arrow -->
  <path d="M 490 280 L 530 280 L 530 370 L 750 370 L 750 310 L 770 310"
        stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
  <rect x="600" y="350" width="80" height="20" rx="3" fill="white"/>
  <text x="640" y="364" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6" text-anchor="middle">Modelo</text>

  <!-- Legend -->
  <rect x="540" y="510" width="420" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="550" y="530" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Leyenda:</text>

  <rect x="550" y="540" width="15" height="15" rx="2" fill="#3B82F6"/>
  <text x="575" y="552" font-family="Arial, sans-serif" font-size="10" fill="#374151">Texto plano (seguro)</text>

  <rect x="700" y="540" width="15" height="15" rx="2" fill="#8B5CF6"/>
  <text x="725" y="552" font-family="Arial, sans-serif" font-size="10" fill="#374151">Encriptado (cliente)</text>

  <rect x="850" y="540" width="15" height="15" rx="2" fill="#D1D5DB"/>
  <text x="875" y="552" font-family="Arial, sans-serif" font-size="10" fill="#374151">Opaco (servidor)</text>

  <!-- Key insight box -->
  <rect x="30" y="350" width="450" height="200" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="255" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">
    Punto Clave: Separacion de Fases
  </text>

  <g transform="translate(50, 400)">
    <circle cx="10" cy="10" r="10" fill="#3B82F6"/>
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">1</text>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">Entrenamiento: Ambiente controlado, datos en texto plano</text>
  </g>

  <g transform="translate(50, 435)">
    <circle cx="10" cy="10" r="10" fill="#10B981"/>
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">2</text>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">Inferencia: Datos del usuario SIEMPRE encriptados</text>
  </g>

  <g transform="translate(50, 470)">
    <circle cx="10" cy="10" r="10" fill="#8B5CF6"/>
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">3</text>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">Modelo: Pesos publicos, operan sobre ciphertexts</text>
  </g>

  <g transform="translate(50, 505)">
    <circle cx="10" cy="10" r="10" fill="#F59E0B"/>
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">4</text>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="11" fill="#374151">Servidor: Solo ve ruido criptografico, NUNCA datos reales</text>
  </g>

</svg>
