<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="realGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="approxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Aproximación Polinomial del Sigmoid para FHE
  </text>
  <text x="450" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
    Convertir funciones no polinomiales en operaciones FHE-compatibles
  </text>

  <!-- Graph Area -->
  <rect x="50" y="80" width="500" height="350" rx="10" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Graph Title -->
  <text x="300" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Comparación: Sigmoid Real vs Aproximación
  </text>

  <!-- Axes -->
  <line x1="100" y1="380" x2="500" y2="380" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="130" x2="300" y2="400" stroke="#94A3B8" stroke-width="2"/>

  <!-- X-axis labels -->
  <text x="100" y="400" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">-5</text>
  <text x="180" y="400" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">-3</text>
  <text x="300" y="400" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">0</text>
  <text x="420" y="400" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">3</text>
  <text x="500" y="400" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">5</text>
  <text x="300" y="420" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">x</text>

  <!-- Y-axis labels -->
  <text x="85" y="135" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">1.0</text>
  <text x="85" y="255" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">0.5</text>
  <text x="85" y="383" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">0</text>
  <text x="70" y="260" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(-90, 70, 260)">sigma(x)</text>

  <!-- 0.5 reference line -->
  <line x1="100" y1="255" x2="500" y2="255" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Real Sigmoid (red curve) -->
  <path d="M 100 375
           Q 120 375 140 373
           Q 180 365 220 340
           Q 260 290 300 255
           Q 340 220 380 170
           Q 420 145 460 137
           Q 480 134 500 133"
        stroke="#EF4444" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Polynomial Approximation (green curve, degree 5) -->
  <path d="M 100 375
           Q 120 374 140 372
           Q 180 360 220 335
           Q 260 285 300 255
           Q 340 225 380 175
           Q 420 150 460 140
           Q 480 138 500 138"
        stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8,4"/>

  <!-- Legend -->
  <g transform="translate(120, 120)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#EF4444" stroke-width="3"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="11" fill="#374151">Sigmoid real: 1/(1+e^-x)</text>
  </g>
  <g transform="translate(120, 145)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#10B981" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="11" fill="#374151">Aproximación grado 5</text>
  </g>

  <!-- Explanation Panel -->
  <rect x="580" y="80" width="300" height="350" rx="10" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <text x="730" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Aproximaciones Polinomiales
  </text>

  <!-- Why needed -->
  <rect x="600" y="125" width="260" height="70" rx="6" fill="#FEF3C7"/>
  <text x="610" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400E">Problema:</text>
  <text x="610" y="165" font-family="Arial, sans-serif" font-size="10" fill="#B45309">FHE solo soporta: +, -, x</text>
  <text x="610" y="180" font-family="Arial, sans-serif" font-size="10" fill="#B45309">No soporta: exp, log, division, sqrt</text>

  <!-- Degrees comparison -->
  <text x="610" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Grados de aproximación:</text>

  <g transform="translate(600, 230)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#DBEAFE"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#1E40AF">Grado 3: 0.5 + 0.197x - 0.004x³</text>
  </g>

  <g transform="translate(600, 268)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#D1FAE5"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#166534">Grado 5: + 0.0001x⁵ (mas preciso)</text>
  </g>

  <g transform="translate(600, 306)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#FCE7F3"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#9D174D">Grado 7: - 0.000002x⁷ (muy preciso)</text>
  </g>

  <!-- Trade-off -->
  <rect x="600" y="350" width="260" height="65" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="610" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Trade-off:</text>
  <text x="610" y="390" font-family="Arial, sans-serif" font-size="10" fill="#374151">Mayor grado = Mas precision</text>
  <text x="610" y="405" font-family="Arial, sans-serif" font-size="10" fill="#374151">Mayor grado = Mas multiplicaciones FHE</text>

  <!-- Footer formulas -->
  <rect x="50" y="445" width="830" height="45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="472" font-family="monospace" font-size="12" fill="#475569">
    Taylor: sigma(x) = 0.5 + (x/4) - (x³/48) + (x⁵/480) - ...   |   Valido para x in [-5, 5]
  </text>
</svg>
