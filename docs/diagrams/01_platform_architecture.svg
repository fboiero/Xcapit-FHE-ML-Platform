<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sdkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="blockchainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#0f172a"/>

  <!-- Title -->
  <rect x="250" y="20" width="400" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="450" y="52" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">XCAPIT FHE-ML PLATFORM</text>

  <!-- Clients Layer -->
  <text x="50" y="110" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">CLIENTS</text>

  <rect x="100" y="120" width="180" height="70" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="190" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Bank</text>
  <text x="190" y="170" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="11">(Fraud Detection)</text>

  <rect x="360" y="120" width="180" height="70" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="450" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Hospital</text>
  <text x="450" y="170" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="11">(Medical Research)</text>

  <rect x="620" y="120" width="180" height="70" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="710" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Fintech</text>
  <text x="710" y="170" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="11">(Credit Scoring)</text>

  <!-- Arrows from clients -->
  <path d="M190 190 L190 230 L450 230 L450 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M450 190 L450 250" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M710 190 L710 230 L450 230" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- SDK Layer -->
  <text x="50" y="270" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">SDK</text>

  <rect x="100" y="280" width="700" height="100" rx="10" fill="url(#sdkGrad)" filter="url(#shadow)"/>
  <text x="450" y="310" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">SDK (Python / TypeScript)</text>

  <rect x="130" y="330" width="150" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="205" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">FHE Module</text>
  <text x="205" y="365" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="9">(TenSEAL)</text>

  <rect x="310" y="330" width="150" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="385" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Blockchain</text>
  <text x="385" y="365" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="9">(web3.py)</text>

  <rect x="490" y="330" width="150" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="565" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">ML Models</text>
  <text x="565" y="365" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="9">(sklearn)</text>

  <rect x="670" y="330" width="100" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="720" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Data Loader</text>

  <!-- Arrow SDK to Backend -->
  <path d="M450 380 L450 420" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="450,430 445,420 455,420" fill="#64748b"/>

  <!-- Backend Layer -->
  <text x="50" y="450" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">BACKEND</text>

  <rect x="100" y="460" width="700" height="100" rx="10" fill="url(#backendGrad)" filter="url(#shadow)"/>
  <text x="450" y="490" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Backend (Django 5.2 LTS)</text>

  <rect x="120" y="505" width="120" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="180" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Consortiums</text>

  <rect x="260" y="505" width="120" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="320" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Governance</text>

  <rect x="400" y="505" width="120" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="460" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">ML Models</text>

  <rect x="540" y="505" width="120" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Compliance</text>

  <rect x="680" y="505" width="100" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="730" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Data Quality</text>

  <!-- Arrow Backend to Blockchain -->
  <path d="M450 560 L450 600" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="450,610 445,600 455,600" fill="#64748b"/>

  <!-- Blockchain Layer -->
  <text x="50" y="630" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">BLOCKCHAIN</text>

  <rect x="100" y="620" width="700" height="70" rx="10" fill="url(#blockchainGrad)" filter="url(#shadow)"/>
  <text x="450" y="645" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Arbitrum (L2 Ethereum)</text>

  <rect x="150" y="655" width="180" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="240" y="672" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">GovernanceV2</text>

  <rect x="360" y="655" width="180" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="450" y="672" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">ModelRegistryV2</text>

  <rect x="570" y="655" width="180" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="660" y="672" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">ComputationVerifierV2</text>
</svg>
