<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="plainBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="fheBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad2)" rx="15"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    Comparación de Accuracy: Texto Plano vs FHE
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">
    La encriptación homomórfica mantiene la precisión del modelo
  </text>

  <!-- Legend -->
  <rect x="260" y="70" width="15" height="15" fill="url(#plainBar)" rx="3"/>
  <text x="280" y="82" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">Texto Plano</text>
  <rect x="380" y="70" width="15" height="15" fill="url(#fheBar)" rx="3"/>
  <text x="400" y="82" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="11">FHE (Encriptado)</text>

  <!-- Chart area -->
  <rect x="50" y="100" width="700" height="250" fill="rgba(0,0,0,0.2)" rx="10"/>

  <!-- Model 1: Linear Regression -->
  <text x="70" y="140" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Linear Regression</text>
  <!-- Plain: 0.94 -->
  <rect x="200" y="125" width="423" height="18" fill="url(#plainBar)" rx="4"/>
  <text x="630" y="138" fill="#3B82F6" font-family="Arial, sans-serif" font-size="11" font-weight="bold">R² = 0.940</text>
  <!-- FHE: 0.939 -->
  <rect x="200" y="148" width="422" height="18" fill="url(#fheBar)" rx="4"/>
  <text x="630" y="161" fill="#10B981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">R² = 0.939</text>

  <!-- Model 2: Logistic Regression -->
  <text x="70" y="200" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Logistic Regression</text>
  <!-- Plain: 0.91 -->
  <rect x="200" y="185" width="410" height="18" fill="url(#plainBar)" rx="4"/>
  <text x="618" y="198" fill="#3B82F6" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.910</text>
  <!-- FHE: 0.908 -->
  <rect x="200" y="208" width="408" height="18" fill="url(#fheBar)" rx="4"/>
  <text x="616" y="221" fill="#10B981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.908</text>

  <!-- Model 3: Decision Tree -->
  <text x="70" y="260" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Decision Tree (d=3)</text>
  <!-- Plain: 0.89 -->
  <rect x="200" y="245" width="401" height="18" fill="url(#plainBar)" rx="4"/>
  <text x="609" y="258" fill="#3B82F6" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.890</text>
  <!-- FHE: 0.885 -->
  <rect x="200" y="268" width="398" height="18" fill="url(#fheBar)" rx="4"/>
  <text x="606" y="281" fill="#10B981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.885</text>

  <!-- Model 4: Neural Network -->
  <text x="70" y="320" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Neural Network (2 capas)</text>
  <!-- Plain: 0.96 -->
  <rect x="200" y="305" width="432" height="18" fill="url(#plainBar)" rx="4"/>
  <text x="640" y="318" fill="#3B82F6" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.960</text>
  <!-- FHE: 0.952 -->
  <rect x="200" y="328" width="428" height="18" fill="url(#fheBar)" rx="4"/>
  <text x="636" y="341" fill="#10B981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Acc = 0.952</text>

  <!-- Scale -->
  <text x="200" y="365" fill="#64748B" font-family="Arial, sans-serif" font-size="10">0.0</text>
  <text x="425" y="365" fill="#64748B" font-family="Arial, sans-serif" font-size="10">0.5</text>
  <text x="650" y="365" fill="#64748B" font-family="Arial, sans-serif" font-size="10">1.0</text>

  <!-- Footer note -->
  <rect x="100" y="375" width="600" height="20" fill="rgba(16,185,129,0.1)" rx="5"/>
  <text x="400" y="389" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="10">
    Diferencia máxima &lt; 1% - Error introducido por aproximación polinomial del sigmoid
  </text>
</svg>
