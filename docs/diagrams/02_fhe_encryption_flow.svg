<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plaintextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="ciphertextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">FHE Encryption Flow</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Plaintext → Ciphertext → Computation → Result</text>

  <!-- Step 1: Plaintext Data -->
  <rect x="50" y="100" width="200" height="140" rx="10" fill="url(#plaintextGrad)" filter="url(#shadow)"/>
  <text x="150" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. PLAINTEXT DATA</text>
  <text x="150" y="145" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="10">⚠️ EXPOSED</text>

  <rect x="65" y="155" width="170" height="75" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="75" y="175" fill="#fef2f2" font-family="Courier, monospace" font-size="11">amount: $523.45</text>
  <text x="75" y="192" fill="#fef2f2" font-family="Courier, monospace" font-size="11">hour: 14</text>
  <text x="75" y="209" fill="#fef2f2" font-family="Courier, monospace" font-size="11">distance: 25.3 km</text>
  <text x="75" y="226" fill="#fef2f2" font-family="Courier, monospace" font-size="11">is_fraud: ?</text>

  <!-- Arrow 1 -->
  <path d="M250 170 L320 170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="285" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">encode</text>

  <!-- Step 2: Encode -->
  <rect x="330" y="100" width="140" height="140" rx="10" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="400" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. ENCODE</text>

  <rect x="345" y="140" width="110" height="90" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="165" text-anchor="middle" fill="#e0e7ff" font-family="Courier, monospace" font-size="10">Vector float[]</text>
  <text x="400" y="185" text-anchor="middle" fill="#c7d2fe" font-family="Courier, monospace" font-size="9">[523.45,</text>
  <text x="400" y="200" text-anchor="middle" fill="#c7d2fe" font-family="Courier, monospace" font-size="9">14.0,</text>
  <text x="400" y="215" text-anchor="middle" fill="#c7d2fe" font-family="Courier, monospace" font-size="9">25.3, ...]</text>

  <!-- Arrow 2 -->
  <path d="M470 170 L540 170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="505" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">encrypt</text>

  <!-- Step 3: Ciphertext -->
  <rect x="550" y="100" width="200" height="140" rx="10" fill="url(#ciphertextGrad)" filter="url(#shadow)"/>
  <text x="650" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. CIPHERTEXT</text>
  <text x="650" y="145" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="10">✅ PROTECTED</text>

  <rect x="565" y="155" width="170" height="75" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="575" y="175" fill="#ecfdf5" font-family="Courier, monospace" font-size="10">[0x7a3f8c2d...</text>
  <text x="575" y="192" fill="#ecfdf5" font-family="Courier, monospace" font-size="10"> 0x4b6e1a9f...</text>
  <text x="575" y="209" fill="#ecfdf5" font-family="Courier, monospace" font-size="10"> 0x2c8d5e7b...</text>
  <text x="575" y="226" fill="#a7f3d0" font-family="Courier, monospace" font-size="10">4096 coefficients]</text>

  <!-- Arrow down to computation -->
  <path d="M650 240 L650 290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Homomorphic Computation -->
  <rect x="200" y="300" width="400" height="120" rx="10" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="400" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">4. HOMOMORPHIC COMPUTATION</text>
  <text x="400" y="350" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="12">Operations on encrypted data (never decrypted)</text>

  <rect x="220" y="365" width="160" height="45" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="300" y="385" text-anchor="middle" fill="#e0e7ff" font-family="Courier, monospace" font-size="10">enc_z = enc_X @ W</text>
  <text x="300" y="400" text-anchor="middle" fill="#a5b4fc" font-family="Courier, monospace" font-size="9">(matrix multiply)</text>

  <rect x="420" y="365" width="160" height="45" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="500" y="385" text-anchor="middle" fill="#e0e7ff" font-family="Courier, monospace" font-size="10">enc_pred = σ(enc_z)</text>
  <text x="500" y="400" text-anchor="middle" fill="#a5b4fc" font-family="Courier, monospace" font-size="9">(activation approx)</text>

  <!-- Arrow down to result -->
  <path d="M400 420 L400 470" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="430" y="450" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">decrypt</text>

  <!-- Step 5: Decrypted Result -->
  <rect x="250" y="480" width="300" height="100" rx="10" fill="url(#ciphertextGrad)" filter="url(#shadow)"/>
  <text x="400" y="510" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">5. RESULT</text>
  <text x="400" y="530" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12">Only decrypted at the end</text>

  <rect x="280" y="545" width="240" height="25" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="562" text-anchor="middle" fill="#ecfdf5" font-family="Courier, monospace" font-size="12">fraud_probability: 0.87 (87%)</text>

  <!-- CKKS Parameters Box -->
  <rect x="50" y="300" width="130" height="120" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1"/>
  <text x="115" y="325" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CKKS Params</text>
  <text x="60" y="350" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="10">Security: 128-bit</text>
  <text x="60" y="370" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="10">Poly deg: 8192</text>
  <text x="60" y="390" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="10">Scale: 2^40</text>
  <text x="60" y="410" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="10">Slots: 4096</text>
</svg>
