version: '3.8'

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:15-alpine
    container_name: xcapit-fhe-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xcapit
      POSTGRES_PASSWORD: xcapit_fhe_secret
      POSTGRES_DB: fheml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcapit -d fheml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ Redis (Cache & Celery) ============
  redis:
    image: redis:7-alpine
    container_name: xcapit-fhe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ Django API (Development - SQLite) ============
  django-dev:
    build:
      context: ./backend_django
      target: development
    image: xcapit-fhe-django:dev
    container_name: xcapit-fhe-django-dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings_test
      - DJANGO_DEBUG=True
      - RUN_MIGRATIONS=true
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://xcapit-privacy.vercel.app
    volumes:
      - ./backend_django:/app
      - django_static:/app/staticfiles
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    profiles:
      - dev
      - django-dev

  # ============ Django API (Production - PostgreSQL) ============
  django:
    build:
      context: ./backend_django
      target: production
    image: xcapit-fhe-django:latest
    container_name: xcapit-fhe-django
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,apifhe.xcapit.com
      - DATABASE_URL=postgresql://xcapit:xcapit_fhe_secret@postgres:5432/fheml
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=true
      - CORS_ALLOWED_ORIGINS=https://xcapit-privacy.vercel.app,https://app.xcapit.io,https://apifhe.xcapit.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============ Django Tests ============
  django-test:
    build:
      context: ./backend_django
      target: development
    image: xcapit-fhe-django:dev
    container_name: xcapit-fhe-django-test
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings_test
    volumes:
      - ./backend_django:/app
    command: pytest tests/ -v --tb=short
    profiles:
      - test

  # ============ Celery Worker (Async Tasks) ============
  celery:
    build:
      context: ./backend_django
      target: production
    image: xcapit-fhe-django:latest
    container_name: xcapit-fhe-celery
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql://xcapit:xcapit_fhe_secret@postgres:5432/fheml
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info
    restart: unless-stopped
    profiles:
      - production
      - celery

  # ============ Legacy FastAPI (keeping for backwards compatibility) ============
  api-legacy:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: xcapit-fhe-ml:latest
    container_name: xcapit-fhe-api-legacy
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - model_data:/app/data
    profiles:
      - legacy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local
  model_data:
    driver: local

networks:
  default:
    name: xcapit-fhe-network
