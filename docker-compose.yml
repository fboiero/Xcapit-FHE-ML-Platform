version: '3.8'

# =============================================================================
# Xcapit FHE-ML Platform - Docker Compose
# =============================================================================
#
# Usage:
#   Development:  docker compose --profile dev up
#   Production:   docker compose up django
#   Tests:        docker compose --profile test up django-test
#
# Security Notes:
#   - PostgreSQL and Redis are NOT exposed to host in production
#   - Use .env file for secrets (never commit to git)
#   - Generate secrets with: openssl rand -hex 32
# =============================================================================

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:16-alpine
    container_name: xcapit-fhe-postgres
    # Only expose port in development (use profiles)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xcapit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fheml}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xcapit} -d ${POSTGRES_DB:-fheml}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # ============ PostgreSQL (Development - with exposed port) ============
  postgres-dev:
    extends:
      service: postgres
    container_name: xcapit-fhe-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xcapit
      POSTGRES_PASSWORD: dev_password_only
      POSTGRES_DB: fheml_dev
    profiles:
      - dev
      - django-dev

  # ============ Redis (Cache & Celery) ============
  redis:
    image: redis:7-alpine
    container_name: xcapit-fhe-redis
    # No port exposed to host in production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # ============ Redis (Development - with exposed port) ============
  redis-dev:
    extends:
      service: redis
    container_name: xcapit-fhe-redis-dev
    command: redis-server
    ports:
      - "6379:6379"
    profiles:
      - dev
      - django-dev

  # ============ Django API (Development) ============
  django-dev:
    build:
      context: ./backend_django
      target: development
    image: xcapit-fhe-django:dev
    container_name: xcapit-fhe-django-dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings_test
      - DJANGO_DEBUG=True
      - RUN_MIGRATIONS=true
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://xcapit-privacy.vercel.app
    volumes:
      - ./backend_django:/app
      - django_static:/app/staticfiles
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    profiles:
      - dev
      - django-dev

  # ============ Django API (Production) ============
  django:
    build:
      context: ./backend_django
      target: production
    image: xcapit-fhe-django:latest
    container_name: xcapit-fhe-django
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xcapit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fheml}
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://xcapit-privacy.vercel.app}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://apifhe.xcapit.com}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    # Security: Read-only filesystem with specific writable paths
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - django_static:/app/staticfiles:ro

  # ============ Django Tests ============
  django-test:
    build:
      context: ./backend_django
      target: development
    image: xcapit-fhe-django:dev
    container_name: xcapit-fhe-django-test
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings_test
    volumes:
      - ./backend_django:/app
    command: pytest tests/ -v --tb=short --cov=apps --cov-report=term-missing
    networks:
      - backend
    profiles:
      - test

  # ============ Celery Worker (Async Tasks) ============
  celery:
    build:
      context: ./backend_django
      target: production
    image: xcapit-fhe-django:latest
    container_name: xcapit-fhe-celery
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xcapit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fheml}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    networks:
      - backend
    profiles:
      - production
      - celery
    # Security: Read-only filesystem
    read_only: true
    tmpfs:
      - /tmp

  # ============ Celery Beat (Scheduled Tasks) ============
  celery-beat:
    build:
      context: ./backend_django
      target: production
    image: xcapit-fhe-django:latest
    container_name: xcapit-fhe-celery-beat
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xcapit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fheml}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info
    restart: unless-stopped
    networks:
      - backend
    profiles:
      - production
      - celery
    # Security: Read-only filesystem
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local

networks:
  backend:
    name: xcapit-fhe-network
    driver: bridge
