# Xcapit FHE-ML Platform - GitLab CI/CD Pipeline

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  PYTHON_VERSION: "3.11"

# Cache pip dependencies
cache:
  paths:
    - .cache/pip
    - venv/

# ============ Templates ============

.python_base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -e ".[dev]"

# ============ Lint Stage ============

lint:syntax:
  stage: lint
  extends: .python_base
  script:
    - pip install ruff black
    - python -m py_compile sdk/**/*.py
    - ruff check sdk/ --ignore E501
    - black --check sdk/ --line-length 100
  allow_failure: true

lint:security:
  stage: lint
  extends: .python_base
  script:
    - pip install bandit safety
    - bandit -r sdk/ -ll
    - safety check
  allow_failure: true

# ============ Test Stage ============

test:unit:
  stage: test
  extends: .python_base
  script:
    - pip install pytest pytest-cov
    - pytest tests/ -v --cov=sdk --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

test:models:
  stage: test
  extends: .python_base
  script:
    - pytest tests/test_models.py -v
  artifacts:
    when: on_failure
    paths:
      - tests/
    expire_in: 1 week

test:api:
  stage: test
  extends: .python_base
  script:
    - pip install httpx pytest-asyncio
    - pytest tests/ -v -k "api" || echo "No API tests found"
  allow_failure: true

# ============ Build Stage ============

build:package:
  stage: build
  extends: .python_base
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - tags

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA --target production .
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA-dev --target development .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA-dev
    # Tag latest on main branch
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
        docker push $DOCKER_IMAGE:latest
      fi
  only:
    - main
    - tags
  when: manual

build:docker-fhe:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA-fhe --target fhe .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA-fhe
  only:
    - main
    - tags
  when: manual

# ============ Deploy Stage ============

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    - echo "Image: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Add your deployment commands here
    # Example: kubectl set image deployment/fhe-ml-api api=$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
  environment:
    name: staging
    url: https://staging-api.xcapit-fhe.example.com
  only:
    - main
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production environment..."
    - echo "Image: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Add your deployment commands here
  environment:
    name: production
    url: https://api.xcapit-fhe.example.com
  only:
    - tags
  when: manual

# ============ Scheduled Jobs ============

benchmark:nightly:
  stage: test
  extends: .python_base
  script:
    - python benchmarks/benchmark_models.py --output benchmark_results.json
  artifacts:
    paths:
      - benchmark_results.json
    expire_in: 1 month
  only:
    - schedules

# ============ Pages (Documentation) ============

pages:
  stage: deploy
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install mkdocs mkdocs-material
    - mkdocs build -d public || mkdir -p public && cp README.md public/index.md
  artifacts:
    paths:
      - public
  only:
    - main
  when: manual
