# =============================================================================
# Xcapit FHE-ML Platform - Production Nginx Configuration
# =============================================================================
#
# This configuration provides:
#   - TLS 1.2/1.3 with modern ciphers
#   - Comprehensive security headers (CSP, HSTS, etc.)
#   - Rate limiting for API and auth endpoints
#   - Health check endpoints without rate limiting
#   - Blocking of common exploit paths
#
# Prerequisites:
#   - SSL certificates at /etc/nginx/ssl/
#   - Or use Let's Encrypt with certbot
#
# Usage:
#   - Place in /etc/nginx/conf.d/xcapit-fhe.conf
#   - Or include from /etc/nginx/nginx.conf
#
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=1r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream for Django/Gunicorn
upstream django {
    server django:8000;
    keepalive 32;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name apifhe.xcapit.com;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apifhe.xcapit.com;

    # ==========================================================================
    # SSL/TLS Configuration
    # ==========================================================================
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman parameter
    # Generate with: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 4096
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ==========================================================================
    # Security Headers
    # ==========================================================================

    # Content Security Policy - API only, no inline scripts needed
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Strict Transport Security - 1 year with preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, but harmless)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy - Disable unnecessary features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ==========================================================================
    # General Settings
    # ==========================================================================

    # Connection limits
    limit_conn conn_limit 50;

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # Buffer sizes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css text/xml application/xml;

    # ==========================================================================
    # Health Check Endpoints (No Rate Limiting)
    # ==========================================================================
    location = /health/ {
        limit_req off;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /api/v2/health/ {
        limit_req off;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ==========================================================================
    # Authentication Endpoints (Strict Rate Limiting)
    # ==========================================================================
    location ~ ^/api/v2/auth/(token|login|register)/ {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # Heavy Computation Endpoints (Very Strict Rate Limiting)
    # ==========================================================================
    location ~ ^/api/v2/(encrypt|decrypt|train|predict)/ {
        limit_req zone=api_heavy burst=5 nodelay;
        limit_req_status 429;

        # Longer timeout for FHE operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # API Documentation (Moderate Rate Limiting)
    # ==========================================================================
    location ~ ^/api/(docs|schema|redoc)/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # General API Endpoints
    # ==========================================================================
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Caching for GET requests (optional)
        # proxy_cache_valid 200 1m;
    }

    # ==========================================================================
    # Static Files
    # ==========================================================================
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================================================
    # Block Common Exploit Paths
    # ==========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(wp-admin|wp-login|wp-content|wordpress|phpmyadmin|pma|mysql|adminer) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.git|\.svn|\.hg|\.env|\.htaccess|\.htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # Admin Panel (Optional - Enable if needed)
    # ==========================================================================
    # Uncomment to enable Django admin access
    # location /admin/ {
    #     # Restrict to specific IPs
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     allow 192.168.0.0/16;
    #     deny all;
    #
    #     proxy_pass http://django;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ==========================================================================
    # Default - Deny All Other Requests
    # ==========================================================================
    location / {
        return 404;
    }
}
