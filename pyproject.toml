[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcapit-fhe-ml"
version = "1.0.0"
description = "Privacy-preserving ML platform using Fully Homomorphic Encryption"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Xcapit Team", email = "dev@xcapit.com"}
]
maintainers = [
    {name = "Xcapit Team", email = "dev@xcapit.com"}
]
keywords = [
    "machine-learning",
    "privacy",
    "fhe",
    "homomorphic-encryption",
    "ckks",
    "federated-learning",
    "blockchain",
    "web3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tenseal>=0.3.14",
    "concrete-ml>=1.5.0",
    "web3>=6.0.0",
    "eth-account>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
deploy = [
    "py-solc-x>=2.0.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
]
postgres = [
    "psycopg2-binary>=2.9.9",
]
production = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=21.0.0",
]
all = [
    "xcapit-fhe-ml[dev,api,deploy,postgres]",
]

[project.urls]
Homepage = "https://github.com/xcapit/Xcapit-FHE-ML-Platform"
Documentation = "https://github.com/xcapit/Xcapit-FHE-ML-Platform/tree/main/docs"
Repository = "https://github.com/xcapit/Xcapit-FHE-ML-Platform.git"
Issues = "https://github.com/xcapit/Xcapit-FHE-ML-Platform/issues"
Changelog = "https://github.com/xcapit/Xcapit-FHE-ML-Platform/blob/main/CHANGELOG.md"

[project.scripts]
xcapit-fhe = "sdk.cli:main"
xcapit-fhe-api = "sdk.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk*"]

[tool.setuptools.package-data]
sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["sdk"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.coverage.run]
source = ["sdk"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
