name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check sdk/ tests/ sdk/tests/

      - name: Run ruff format check
        run: ruff format --check sdk/ tests/ sdk/tests/

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ sdk/tests/ -v --tb=short --cov=sdk --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-django:
    name: Django Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-django-${{ hashFiles('backend_django/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-django-

      - name: Install dependencies
        working-directory: backend_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend_django
        run: |
          DJANGO_SETTINGS_MODULE=config.settings_test pytest --cov=apps --cov-report=xml --cov-fail-under=90 -v --tb=short

      - name: Upload Django coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend_django/coverage.xml
          flags: django
          fail_ci_if_error: false

  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge tests
        working-directory: contracts
        run: forge test -vvv

      - name: Run Forge coverage
        working-directory: contracts
        run: forge coverage --report summary
        continue-on-error: true

  test-typescript:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: sdk-typescript
        run: npm install

      - name: Build
        working-directory: sdk-typescript
        run: npm run build

      - name: Lint
        working-directory: sdk-typescript
        run: npm run lint

  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-django, build-dashboard]

    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CI: "true"
      E2E_BASE_URL: http://localhost:3000
      E2E_BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-django-${{ hashFiles('backend_django/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-django-

      - name: Install backend dependencies
        working-directory: backend_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations
        working-directory: backend_django
        run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py migrate

      - name: Start Django backend
        working-directory: backend_django
        run: |
          DJANGO_SETTINGS_MODULE=config.settings_test python manage.py runserver 127.0.0.1:8000 &
          sleep 3
          curl -sf http://localhost:8000/health/ || (echo "Backend failed to start" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Start dashboard dev server
        working-directory: dashboard
        run: |
          npm run dev &
          sleep 5
          curl -sf http://localhost:3000/ || (echo "Dashboard failed to start" && exit 1)

      - name: Run Playwright E2E tests
        working-directory: dashboard
        run: npx playwright test --reporter=github,html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: dashboard/test-results/
          retention-days: 7

  perf-tests:
    name: Performance Tests (Locust)
    runs-on: ubuntu-latest
    needs: test-django
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'perf-test')

    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-perf-${{ hashFiles('backend_django/requirements.txt', 'backend_django/requirements-perf.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-perf-

      - name: Install dependencies
        working-directory: backend_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-perf.txt

      - name: Run migrations and seed perf user
        working-directory: backend_django
        run: |
          DJANGO_SETTINGS_MODULE=config.settings_test python manage.py migrate
          DJANGO_SETTINGS_MODULE=config.settings_test python manage.py shell -c "
          from apps.core.models import User, Company
          c, _ = Company.objects.get_or_create(name='Xcapit Perf Test', defaults={'email': 'perf@xcapit.test', 'industry': 'banking'})
          u, _ = User.objects.get_or_create(email='perf@xcapit.test', defaults={'company': c, 'is_active': True})
          u.set_password('perf-test-password'); u.save()
          print('Perf user ready:', u.email)
          "

      - name: Start Django backend (production-like)
        working-directory: backend_django
        run: |
          DJANGO_SETTINGS_MODULE=config.settings_test python manage.py runserver 127.0.0.1:8000 &
          sleep 3
          curl -sf http://localhost:8000/health/ || (echo "Backend failed to start" && exit 1)

      - name: Run Locust baseline (10 users, 1 min)
        working-directory: backend_django
        run: |
          locust -f tests/performance/locustfile.py \
            --host http://localhost:8000 \
            --users 10 --spawn-rate 2 --run-time 1m \
            --headless --only-summary --html perf-report.html

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-perf-report
          path: backend_django/perf-report.html
          retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pip-audit safety

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.95.9
        if: github.event_name == 'pull_request'
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Check for secrets (push)
        uses: trufflesecurity/trufflehog@v3.95.9
        if: github.event_name == 'push'
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_django
          target: production
          push: false
          load: true
          tags: xcapit-fhe-django:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: xcapit-fhe-django:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v4
        id: grype-scan
        with:
          image: xcapit-fhe-django:scan
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype-container

      - name: Print scan summary
        if: always()
        run: |
          echo "## Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Container vulnerability scanning completed." >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
